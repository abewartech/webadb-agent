services:
  bridge:
    build: .
    image: webadb-agent:latest
    ports:
      # Web UI + REST API. Bind to localhost only; expose wider only
      # behind a tunnel (see docs/REMOTE-ACCESS.md).
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach the adb server running on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
